<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Melange</title>
<style>
  /*
   * 화면 스타일. 색과 표면은 morglay 의 디자인 토큰을 따랐다 (같은 사람의 다른 프로젝트).
   * 어두운 바탕에 반투명 유리 표면, 떠 있는 층에만 블러를 건다 — 뒤가 움직이지 않는
   * 붙박이 패널까지 블러를 걸면 비용만 들고 보기에 달라지는 것이 없다.
   */
  :root {
    color-scheme: dark;

    --weave: repeating-linear-gradient(45deg,
               rgba(255,255,255,.030) 0 1px, transparent 1px 15px);
    --backdrop:
      var(--weave),
      radial-gradient(1150px 860px at 16% 4%, rgba(152,108,255,.62), transparent 64%),
      radial-gradient(1000px 780px at 90% 96%, rgba(34,198,210,.42), transparent 62%),
      radial-gradient(780px 620px at 88% 2%, rgba(255,104,170,.24), transparent 66%),
      radial-gradient(140% 110% at 50% 50%, transparent 52%, rgba(0,0,0,.26) 100%),
      linear-gradient(165deg, #0a0c12 0%, #090b11 55%, #0c0f17 100%);
    --surface: rgba(20,24,32,.34);
    --surface-float: rgba(22,26,35,.44);
    --surface-menu: rgba(24,28,38,.46);
    --surface-sheet: rgba(22,26,35,.62);
    --surface-pop: rgba(20,23,31,.95);
    --blur-menu: blur(30px) saturate(200%) brightness(.88);
    --glass: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.015) 40%, transparent 75%);
    --blur: blur(24px) saturate(180%) brightness(.62);
    --edge: rgba(255,255,255,.12);
    --sheen: inset 0 1px 0 rgba(255,255,255,.10);
    --shadow-float: 0 18px 48px rgba(0,0,0,.45);
    --shadow-card: 0 10px 30px rgba(0,0,0,.28);
    --rim-lit: rgba(255,255,255,.42);
    --rim-dim: rgba(255,255,255,.10);
    --bar: rgba(13,15,21,.82);
    --bar-lip: rgba(255,255,255,.05);
    --stage-bg: linear-gradient(180deg, rgba(10,12,17,.56), rgba(10,12,17,.70));
    --fill: rgba(255,255,255,.045);
    --fill-strong: rgba(255,255,255,.085);
    --fill-hover: rgba(255,255,255,.12);
    --inset: rgba(0,0,0,.26);
    --field: #171b23;
    --field-hi: #2a3140;
    --border: rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.13);
    --gutter: 6px;
    --radius-card: 12px;
    --radius: 6px;
    --accent: #bb99ff;
    --accent-hover: #c9adff;
    --on-accent: #1c1433;
    --text: #d9dee6;
    --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* 캔버스가 읽어 가는 색 (src/render/schematic.ts 의 theme()) */
    --bg: transparent;           /* 회로도 바탕은 유리 뒤가 비친다 */
    --fg: #f2f4f7;
    --mut: #8b95a3;
    --line: rgba(255,255,255,.12);
    --panel: var(--surface);
    --grid: rgba(255,255,255,.24); --grid-bold: rgba(255,255,255,.44);
    --axis: rgba(255,255,255,.12);
    --wire: #4a8dff;
    --part: #d9dee6;
    --pin: #747d8b;
    --select: #ffa53d;
    --junction: #ef5b5b;
    --label: #30c4ba;
    --loose: #e7b43c;
    --highlight: #bb99ff;
    --connect: #3fbf7f;
    --ok: #3fbf7f; --bad: #ef5b5b; --warn: #e7b43c;
    --png-bg:#12151b;
    --sparkle: rgba(255,255,255,.055);
    --t1:#4a8dff; --t2:#ef5b5b; --t3:#3fbf7f; --t4:#e7b43c; --t5:#bb99ff;
  }
  :root.solid {
    --backdrop:#101216; --glass:none; --surface:#1b1e23; --surface-float:#20242a;
    --surface-menu:#20242a; --surface-pop:#20242a; --blur:none;
    --rim-lit:rgba(255,255,255,.08); --rim-dim:rgba(0,0,0,.2);
  }
  :root.solid .card, :root.solid #finder, :root.solid #ctx, :root.solid .menu, :root.solid #calcpop {
    -webkit-backdrop-filter:none; backdrop-filter:none;
  }
  @media (prefers-reduced-transparency: reduce) {
    .card, #finder, #ctx, .menu, #calcpop { -webkit-backdrop-filter:none; backdrop-filter:none; }
  }

  /*
   * 밝은 테마. 같은 유리 감을 쓰되 판을 뒤집는다 — 흰 유리에 짙은 글자,
   * 하이라이트는 위에서 들어오는 흰빛이다.
   *
   * 두 번 적은 이유: 바탕 화면 설정을 따르는 경우(미디어 질의)와 사용자가 직접
   * 고른 경우(.light)를 CSS 만으로 한 덩어리에 묶을 방법이 없다.
   */
  :root.light { color-scheme: light;
    --weave: repeating-linear-gradient(45deg,
               rgba(16,20,30,.035) 0 1px, transparent 1px 15px);
    --backdrop:
      var(--weave),
      radial-gradient(1150px 860px at 16% 4%, rgba(139,92,246,.38), transparent 64%),
      radial-gradient(1000px 780px at 90% 96%, rgba(16,186,200,.30), transparent 62%),
      radial-gradient(780px 620px at 88% 2%, rgba(244,114,182,.20), transparent 66%),
      radial-gradient(140% 110% at 50% 50%, transparent 54%, rgba(50,56,88,.10) 100%),
      linear-gradient(165deg, #f4f6fb 0%, #eceff7 55%, #f0f2fa 100%);
    --surface: rgba(255,255,255,.42);
    --surface-float: rgba(255,255,255,.52);
    --surface-menu: rgba(255,255,255,.52);
    --surface-sheet: rgba(255,255,255,.66);
    --surface-pop: rgba(255,255,255,.95);
    --blur-menu: blur(30px) saturate(200%) brightness(1.06);
    --glass: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.28) 42%, transparent 78%);
    --blur: blur(24px) saturate(180%) brightness(1.06);
    --edge: rgba(16,20,30,.12);
    --sheen: inset 0 1px 0 rgba(255,255,255,.85);
    --shadow-float: 0 18px 48px rgba(20,26,45,.18);
    --shadow-card: 0 10px 28px rgba(20,26,45,.12);
    --rim-lit: rgba(255,255,255,.95);
    --rim-dim: rgba(20,26,45,.06);
    --bar: rgba(250,251,254,.86);
    --bar-lip: rgba(255,255,255,.9);
    --stage-bg: linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.60));
    --fill: rgba(16,20,30,.04);
    --fill-strong: rgba(16,20,30,.07);
    --fill-hover: rgba(16,20,30,.12);
    --inset: rgba(16,20,30,.055);
    --field: #f1f3f8;
    --field-hi: #e2e6ef;
    --border: rgba(16,20,30,.09);
    --border-strong: rgba(16,20,30,.15);
    --accent: #7c4dff; --accent-hover: #6a38f5; --on-accent: #ffffff;
    --text: #1a1d23;
    --fg: #11141a; --mut: #5c6472;
    --line: rgba(16,20,30,.14);
    --grid: rgba(16,20,30,.30); --grid-bold: rgba(16,20,30,.52); --axis: rgba(16,20,30,.18);
    --wire: #2563eb; --part: #1f2937; --pin: #8a93a3;
    --select: #e07b00; --junction: #d93a3a; --label: #0f766e;
    --loose: #b45309; --highlight: #7c4dff; --connect: #15803d;
    --ok:#15803d; --bad:#c0392b; --warn:#b45309;
    --t1:#2563eb; --t2:#d93a3a; --t3:#0f9d58; --t4:#c77700; --t5:#7c4dff;
    --png-bg:#f7f8fb;
  }
  :root.light.solid {
    --backdrop:#eef0f5; --glass:none; --surface:#ffffff; --surface-float:#ffffff;
    --surface-menu:#ffffff; --surface-pop:#ffffff; --blur:none;
  }
  @media (prefers-color-scheme: light) {
    :root:not(.dark) { color-scheme: light;
      --weave: repeating-linear-gradient(45deg,
                 rgba(16,20,30,.035) 0 1px, transparent 1px 15px);
      --backdrop:
        var(--weave),
        radial-gradient(1150px 860px at 16% 4%, rgba(139,92,246,.38), transparent 64%),
        radial-gradient(1000px 780px at 90% 96%, rgba(16,186,200,.30), transparent 62%),
        radial-gradient(780px 620px at 88% 2%, rgba(244,114,182,.20), transparent 66%),
        radial-gradient(140% 110% at 50% 50%, transparent 54%, rgba(50,56,88,.10) 100%),
        linear-gradient(165deg, #f4f6fb 0%, #eceff7 55%, #f0f2fa 100%);
      --surface: rgba(255,255,255,.42);
      --surface-float: rgba(255,255,255,.52);
      --surface-menu: rgba(255,255,255,.52);
      --surface-sheet: rgba(255,255,255,.66);
      --surface-pop: rgba(255,255,255,.95);
      --blur-menu: blur(30px) saturate(200%) brightness(1.06);
      --glass: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.28) 42%, transparent 78%);
      --blur: blur(24px) saturate(180%) brightness(1.06);
      --edge: rgba(16,20,30,.12);
      --sheen: inset 0 1px 0 rgba(255,255,255,.85);
      --shadow-float: 0 18px 48px rgba(20,26,45,.18);
      --shadow-card: 0 10px 28px rgba(20,26,45,.12);
      --rim-lit: rgba(255,255,255,.95);
      --rim-dim: rgba(20,26,45,.06);
      --bar: rgba(250,251,254,.86);
      --bar-lip: rgba(255,255,255,.9);
      --stage-bg: linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.60));
      --fill: rgba(16,20,30,.04);
      --fill-strong: rgba(16,20,30,.07);
      --fill-hover: rgba(16,20,30,.12);
      --inset: rgba(16,20,30,.055);
      --field: #f1f3f8;
      --field-hi: #e2e6ef;
      --border: rgba(16,20,30,.09);
      --border-strong: rgba(16,20,30,.15);
      --accent: #7c4dff; --accent-hover: #6a38f5; --on-accent: #ffffff;
      --text: #1a1d23;
      --fg: #11141a; --mut: #5c6472;
      --line: rgba(16,20,30,.14);
      --grid: rgba(16,20,30,.30); --grid-bold: rgba(16,20,30,.52); --axis: rgba(16,20,30,.18);
      --wire: #2563eb; --part: #1f2937; --pin: #8a93a3;
      --select: #e07b00; --junction: #d93a3a; --label: #0f766e;
      --loose: #b45309; --highlight: #7c4dff; --connect: #15803d;
      --ok:#15803d; --bad:#c0392b; --warn:#b45309;
      --t1:#2563eb; --t2:#d93a3a; --t3:#0f9d58; --t4:#c77700; --t5:#7c4dff;
      --png-bg:#f7f8fb;
      --sparkle: rgba(124,77,255,.07);
    }
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--backdrop); background-attachment:fixed;
    color:var(--text, #d9dee6); overflow:hidden;
    font:12px/1.4 var(--font); -webkit-font-smoothing:antialiased;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:grid; grid-template-rows:34px 40px minmax(0,1fr) auto auto; gap:var(--gutter);
    /*
     * 칸을 **명시한다.** 안 적으면 암묵적 칸이 `auto` 라 내용의 min-content 를 따라가는데,
     * 도구 막대의 min-content 는 묶음 전부를 더한 값(폰에서 658px)이다. `#tools` 의
     * min-width:0 · overflow-x:auto 는 **레이아웃 때 줄어들게 할 뿐 min-content 를 줄이지
     * 않는다.** 그래서 폰에서 창이 통째로 뷰포트보다 넓어져 상하좌우가 다 잘렸다.
     * minmax(0,1fr) 로 칸을 컨테이너 너비에 묶으면 그때서야 도구 막대가 줄어 스크롤된다.
     */
    grid-template-columns:minmax(0,1fr);
    padding-left:max(var(--gutter), env(safe-area-inset-left));
    padding-right:max(var(--gutter), env(safe-area-inset-right));
    padding-bottom:max(var(--gutter), env(safe-area-inset-bottom));
  }

  /*
   * 유리 표면 하나. 네 겹이다.
   *   1) 굴절  var(--lens) — src/ui/glass.ts 가 요소마다 SVG 필터를 걸어 준다.
   *            픽셀을 **옮기는** 것은 이것뿐이고, 없으면 그냥 서리 낀 유리다.
   *   2) 블러·채도  뒤를 뭉개고 색을 살린다
   *   3) 색조  아주 옅은 흰 막. 유리의 두께를 만든다
   *   4) 림 스페큘러  왼쪽 위에서 들어온 빛이 모서리에 맺힌 것.
   *            안쪽 그림자 두 방향(밝은 쪽/어두운 쪽)이 유리의 두께를 만든다.
   */
  .card {
    position:relative;
    background:var(--glass), var(--surface);
    border:1px solid var(--edge);
    border-radius:var(--radius-card);
    -webkit-backdrop-filter:var(--lens, none) var(--blur);
    backdrop-filter:var(--lens, none) var(--blur);
    box-shadow:
      inset 1px 1px 1px var(--rim-lit),
      inset -1px -1px 1px var(--rim-dim),
      var(--shadow-card);
  }
  /* 유리 위에 유리를 겹치지 않는다 — 두 번 겹치면 뒤가 안 보이고 비용만 는다 */
  .card .card { backdrop-filter:none; -webkit-backdrop-filter:none; }

  /* ── 툴바 ──────────────────────────────────────────────────────── */
  #toolbar { display:flex; align-items:center; gap:8px; padding:0 6px; }
  /* 도구 묶음만 밀린다. 실행·상태는 오른쪽에 고정 */
  #tools { display:flex; align-items:center; gap:8px; flex:1 1 0; min-width:0;
           overflow-x:auto; scrollbar-width:none; }
  #tools::-webkit-scrollbar { display:none; }
  #right { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .tool-group { display:flex; gap:2px; padding:2px; background:var(--inset);
                border-radius:9px; flex:0 0 auto; }
  .tool-btn { display:inline-flex; align-items:center; justify-content:center; gap:5px;
              height:28px; min-width:30px; padding:0 6px; background:none; border:0;
              border-radius:7px; color:var(--mut); cursor:pointer; white-space:nowrap;
              font:inherit; }
  .tool-btn.wide { padding:0 9px; }
  .tool-btn:hover:not(:disabled) { background:var(--fill-strong); color:var(--fg); }
  .tool-btn.on { background:var(--accent); color:var(--on-accent); }
  .tool-btn:disabled { opacity:.35; cursor:default; }
  .tool-btn.run { min-width:68px; color:var(--ok); font-weight:600; }
  .tool-btn.run:hover:not(:disabled) { background:rgba(63,191,127,.16); color:var(--ok); }
  .sp { flex:1 1 0; min-width:0; }

  /* ── 메뉴 막대: 창에 붙은 막대 ─────────────────────────────────── */
  #menubar {
    display:flex; align-items:center; gap:2px; padding:0 10px;
    margin:0 calc(-1 * var(--gutter));
    min-width:0;
    border:0; border-bottom:1px solid var(--edge); border-radius:0;
    background:var(--bar);
    -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
    box-shadow:0 1px 0 var(--bar-lip), 0 6px 18px rgba(0,0,0,.22);
  }
  #menubar > button, #menus > button {
                      height:24px; padding:0 10px; background:none; border:0; border-radius:6px;
                      color:var(--mut); font:inherit; line-height:1.45; cursor:pointer;
                      white-space:nowrap; }
  /*
   * 메뉴만 밀린다. 테마 버튼은 오른쪽 끝에 고정 — 도구 막대의 실행 버튼과 같은 생각이다.
   * 메뉴 막대째로 밀면 폰에서 버튼이 화면 밖으로 나가 누를 수가 없다.
   */
  #menus { display:flex; align-items:center; gap:2px; flex:1 1 0; min-width:0;
           overflow-x:auto; overflow-y:hidden;
           scrollbar-width:none; overscroll-behavior-x:contain; }
  #menus::-webkit-scrollbar { display:none; }
  #menubar > button:hover, #menus > button:hover { background:var(--fill-strong); color:var(--fg); }
  #menubar > button.on, #menus > button.on { background:var(--accent); color:var(--on-accent); }
  /*
   * 밝게·어둡게 바꾸는 버튼. 글자가 아니라 아이콘이라 정사각에 가깝게 둔다.
   * 선택자에 부모를 적는 것은 명시도 때문이다 — `#menubar > button` 의 가로 여백 10px 이
   * 이기면 border-box 28px 안쪽이 8px 만 남아 **아이콘이 눌려 찌그러진다.**
   */
  /*
   * 편집기 전환 [Circuit ▾ Placement ▾ Layout] — 테마 버튼 바로 왼쪽 (src/layout/ui/switch.ts).
   * 보이는 편집기는 강조색, 여럿이 같이 보일 때 키를 받는 것은 밑줄, 새 창에 있는 것은 기울인 글씨.
   */
  #ws-switch { flex:0 0 auto; display:inline-flex; align-items:center; height:26px; margin-left:6px; padding:2px;
               background:var(--inset); border-radius:8px; }
  #ws-switch button { height:22px; background:none; border:0; color:var(--mut); font:inherit; cursor:pointer;
                      border-radius:6px; white-space:nowrap; }
  #ws-switch .ws-name { padding:0 9px; }
  #ws-switch .ws-caret { width:16px; padding:0; display:inline-flex; align-items:center; justify-content:center; opacity:.7; }
  #ws-switch button:hover { background:var(--fill-strong); color:var(--fg); opacity:1; }
  #ws-switch .ws-name.on { background:var(--accent); color:var(--on-accent); }
  #ws-switch .ws-name.active { box-shadow:inset 0 -2px 0 var(--on-accent); }
  #ws-switch .ws-name.out { color:var(--accent); font-style:italic; }
  @media (max-width: 720px) { #ws-switch .ws-name { padding:0 6px; } #ws-switch .ws-caret { width:13px; } }
  /* AI — 어시스턴트 칸 열고 닫기. 켜져 있으면 강조색 (#menubar > button.on) */
  #menubar > #t-ai { flex:0 0 auto; display:inline-flex; align-items:center; gap:5px; padding:0 9px; margin-left:4px; font-weight:600; }
  #menubar > #t-theme {
    flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    width:28px; padding:0; margin-left:4px; }
  @media (pointer: coarse) { #menubar > #t-theme { width:32px; } }
  /* 이름은 기울인 글씨에 그라데이션. 앱에서 유일하게 색이 흐르는 글자다 */
  #brand { font-weight:700; font-style:italic; font-size:15px; letter-spacing:-.015em;
           padding:0 12px 0 2px; flex:0 0 auto;
           line-height:1.45; display:inline-block;
           background:linear-gradient(96deg, #ffffff 0%, #ddcbff 44%, #a97cff 100%);
           -webkit-background-clip:text; background-clip:text; color:transparent;
           -webkit-text-fill-color:transparent; }
  :root.light #brand {
    background:linear-gradient(96deg, #241543 0%, #5a32c4 46%, #7c4dff 100%);
    -webkit-background-clip:text; background-clip:text; }
  @media (prefers-color-scheme: light) {
    :root:not(.dark) #brand {
      background:linear-gradient(96deg, #241543 0%, #5a32c4 46%, #7c4dff 100%);
      -webkit-background-clip:text; background-clip:text; }
  }
  .btn { display:inline-flex; align-items:center; gap:6px; height:24px;
    padding:0 10px; background:var(--fill-strong); border:1px solid var(--border-strong);
    border-radius:8px; box-shadow:var(--sheen); color:var(--fg); cursor:pointer;
    font:inherit; white-space:nowrap; }
  .btn:hover { background:var(--fill-hover); }
  #save, #status { color:var(--mut); white-space:nowrap; flex:0 0 auto; }

  /* ── 가운데 3분할 ──────────────────────────────────────────────── */
  /* 패널을 껐다 켤 수 있어야 해서 그리드가 아니라 flex 다 — 숨기면 자리까지 빠진다 */
  #mid { display:flex; min-height:0; }
  #lib { flex:0 0 var(--lib-w, 168px); }
  #props { flex:0 0 var(--props-w, 240px); }
  /*
   * 어시스턴트 칸 (src/ai/). 페이지 격자의 맨 오른쪽 칸이다 — 도구 막대 줄부터 아래 패널까지 세로로 다 쓰고,
   * 회로 · Placement · Layout 어느 보기에서도(둘 · 셋을 같이 볼 때도) 그 자리에 있다. 메뉴 막대의 AI 단추가
   * 열고 닫는다 (테마 단추 왼쪽). 처음에는 닫혀 있다. 안쪽은 어시스턴트 본체와 같이 받는 CSS 가 그린다 —
   * 여기는 칸의 자리와 크기만. 본체를 받기 전에도 칸은 있어야 한다. 좁은 화면에서는 서랍이다 (아래).
   */
  #ai { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
  #menubar { grid-column:1 / -1; }
  #toolbar, #mid, #split-bottom, #bottom { grid-column:1; }
  @media (min-width: 901px) {
    :root:not(.no-ai) body { grid-template-columns:minmax(0,1fr) var(--ai-w, 340px); }
    #ai { grid-column:-2 / -1; grid-row:2 / -1; }
    /* 가름대는 칸 사이 틈에 — 격자의 같은 칸에 두고 왼쪽 틈으로 민다 */
    #split-ai { grid-column:-2 / -1; grid-row:2 / -1; justify-self:start; width:var(--gutter);
                margin-left:calc(-1 * var(--gutter)); z-index:2; }
  }
  .ai-boot { padding:12px; color:var(--mut); }
  :root.no-ai #ai, :root.no-ai #split-ai { display:none; }
  /*
   * 간편 모드: 회로도 · 어시스턴트 · 결과만. 부품 목록과 속성 패널을 숨기고, 아래 탭은 파형 · 측정 · 계산기만 둔다.
   * 좁은 화면에서 그 둘의 서랍을 여는 버튼도 숨긴다 — 열 것이 없다.
   */
  :root.simple #lib, :root.simple #split-lib, :root.simple #props, :root.simple #split-props,
  :root.simple #tab-net, :root.simple #tab-log, :root.simple #tab-issue { display:none; }
  :root.simple .tool-group.g-libbtn, :root.simple .tool-group.g-propsbtn { display:none !important; }
  .tool-btn.mode { font-weight:600; font-size:11.5px; padding:0 9px; }
  .btn.ask { margin:0 0 8px; height:26px; color:var(--accent); }
  .btn.ask svg { flex:0 0 auto; }
  #stage { flex:1 1 0; }
  .split.v { flex:0 0 var(--gutter); }
  :root.no-lib #lib, :root.no-lib #split-lib,
  :root.no-props #props, :root.no-props #split-props,
  :root.no-bottom #bottom, :root.no-bottom #split-bottom { display:none; }
  .split { background:transparent; }
  .split:hover, .split.on { background:var(--accent); opacity:.5; border-radius:3px; }
  .split.v { cursor:col-resize; }
  .split.h { cursor:row-resize; height:var(--gutter); }

  #lib, #props { overflow-y:auto; padding:10px; }
  h2 { font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut);
       margin:0 0 7px; font-weight:600; }
  h2:not(:first-child) { margin-top:16px; }
  .libitem { display:block; width:100%; height:26px; line-height:26px; padding:0 8px;
             margin-bottom:3px; background:none; border:0; border-radius:var(--radius);
             color:var(--text, #d9dee6); cursor:pointer; font:inherit; text-align:left;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .libitem:hover { background:var(--fill-strong); color:var(--fg); }
  .libitem.on { background:var(--accent); color:var(--on-accent); }
  /* 묶음 머리글은 접는 버튼이다. 삼각형은 글꼴을 안 타게 테두리로 그린다 */
  .libcat { display:flex; align-items:center; width:100%; font-size:10.5px; color:var(--mut);
            margin:10px 0 3px; padding:2px 2px; letter-spacing:.04em; cursor:pointer;
            background:none; border:0; border-radius:var(--radius); font-family:inherit;
            text-align:left; text-transform:uppercase; }
  .libgroup:first-child .libcat { margin-top:0; }
  .libcat:hover { color:var(--fg); background:var(--fill); }
  .libcat::before {
    content:""; flex:0 0 auto; width:0; height:0; margin-right:6px;
    border-left:4px solid currentColor;
    border-top:3.5px solid transparent; border-bottom:3.5px solid transparent;
    transform:rotate(90deg); transition:transform .12s ease; }
  .libgroup.closed .libcat::before { transform:rotate(0deg); }
  .libgroup.closed .libitems { display:none; }

  /*
   * 캔버스도 유리로 보이게 한다. 다만 회로도를 읽는 데 방해가 되면 안 되므로
   * 아주 옅게만 — 커서를 따라다니는 빛과 가장자리 그늘뿐이고, 둘 다 캔버스 위에
   * 겹친 별도 층이라 그리기 성능에는 영향이 없다 (합성만 한다).
   */
  #stage {
    position:relative; min-width:0; touch-action:none; isolation:isolate;
    background:var(--stage-bg);
    -webkit-backdrop-filter:none !important; backdrop-filter:none !important;
  }
  #stage::after { content:""; position:absolute; inset:0;
                  pointer-events:none; border-radius:inherit; }
  /* 가장자리 그늘 + 윗면 하이라이트 */
  #stage::after {
    background: radial-gradient(150% 130% at 50% 112%, rgba(0,0,0,.14), transparent 52%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.055);
  }
  :root.light #stage::after {
    background: radial-gradient(150% 130% at 50% 112%, rgba(20,26,45,.05), transparent 52%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
  }
  @media (prefers-color-scheme: light) {
    :root:not(.dark) #stage::after {
      background: radial-gradient(150% 130% at 50% 112%, rgba(20,26,45,.05), transparent 52%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
  }
  /* 실행 중에는 테두리가 살짝 숨을 쉰다 */
  #stage.running { animation:breathe 1.6s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow:var(--sheen), 0 0 0 1px rgba(187,153,255,.18); }
    50%      { box-shadow:var(--sheen), 0 0 0 2px rgba(187,153,255,.42); }
  }
  @media (prefers-reduced-motion: reduce) { #stage.running { animation:none; } }
  #stage.dropping { outline:2px dashed var(--connect); outline-offset:-4px; }
  canvas.layer { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #text, #overlay { pointer-events:none; }
  /* WebGPU 를 못 띄웠을 때 캔버스 자리에 이유를 적는다 */
  .nogpu { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
           align-items:center; text-align:center; gap:4px; padding:24px; color:var(--mut);
           font-size:13px; line-height:1.6; pointer-events:none; }
  .nogpu b { color:var(--fg); font-size:15px; }

  /* ── 속성 패널 ─────────────────────────────────────────────────── */
  label.f { display:block; margin:8px 0; }
  label.f .row { display:flex; justify-content:space-between; font-size:10.5px; color:var(--mut);
                 text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; }
  label.f input, label.f select, #propbody textarea, #propbody select,
  #simbody select, #simbody input, #finder input {
    width:100%; font:12px var(--mono); height:26px; padding:0 7px;
    border:1px solid var(--border); border-radius:5px;
    background:var(--field, var(--inset)); color:var(--text, #d9dee6); }
  /*
   * 펼친 목록. 크로미움은 option 에 적어 준 색을 쓰고, 안 적으면 select 의 색을
   * 물려받는다 — 둘 다 적어 두면 어느 쪽으로 그려도 읽힌다.
   */
  select option { background:var(--field, #171b23); color:var(--text, #d9dee6); }
  select option:checked { background:var(--field-hi, #2a3140); }
  label.f input:focus, label.f select:focus, #propbody textarea:focus, #propbody select:focus,
  #simbody select:focus, #simbody input:focus,
  #finder input:focus { outline:none; border-color:var(--accent); }
  #propbody textarea { height:auto; padding:6px 7px; resize:vertical; line-height:1.5; }
  #simbody select, #propbody select, label.f select { height:26px; cursor:pointer; }
  #propbody .title { font-weight:600; color:var(--fg); margin-bottom:6px; }
  #propbody .chk { display:flex; align-items:center; gap:6px; margin-top:8px; }
  #propbody .note, .note { color:var(--mut); font-size:11px; margin-top:6px; line-height:1.5; }
  .empty { color:var(--mut); }

  /*
   * 측정 줄. 원문을 그대로 고치게 두므로 한 칸짜리 입력 + 지우기 단추다.
   * 입력은 flex-basis 0 으로 눌러야 긴 줄이 패널을 밀어내지 않는다.
   */
  #simbody .measrow { display:flex; gap:5px; margin:6px 0; }
  #simbody .measrow input { flex:1 1 0; min-width:0; }
  #simbody .measrow .btn { flex:0 0 auto; width:26px; height:26px; padding:0;
                           justify-content:center; font-size:15px; line-height:1; }

  /* ── 떠 있는 층: 여기에만 블러 ─────────────────────────────────── */
  #finder, #ctx, .menu, #calcpop {
    background:var(--glass), var(--surface-menu);
    border:1px solid var(--edge);
    -webkit-backdrop-filter:var(--blur-menu, var(--blur));
    backdrop-filter:var(--blur-menu, var(--blur));
    box-shadow:
      inset 1px 1px 1px var(--rim-lit),
      inset -1px -1px 1px var(--rim-dim),
      var(--shadow-float);
  }
  #finder { position:fixed; left:50%; top:14%; transform:translateX(-50%); z-index:40;
            width:min(340px, calc(100vw - 24px)); border-radius:14px; padding:8px; }
  #finder input + input { margin-top:5px; }
  .flist { max-height:min(300px, 50vh); overflow:auto; margin-top:6px; }
  .fitem { display:flex; justify-content:space-between; align-items:center; gap:8px;
           width:100%; min-height:26px; padding:4px 8px; text-align:left; border:0;
           background:none; border-radius:7px; color:var(--text, #d9dee6); cursor:pointer; font:inherit; }
  .fitem:hover, .fitem.on { background:var(--accent); color:var(--on-accent); }
  .fitem:hover .mut, .fitem.on .mut { color:var(--on-accent); opacity:.75; }
  .fitem .mut { color:var(--mut); font-size:11px; }
  .frow { display:flex; justify-content:flex-end; gap:6px; margin-top:6px; }
  #finder .chk { display:flex; align-items:center; gap:6px; padding:4px 8px; }

  /*
   * 부품 라이브러리 창 (Shift+F). 세 칸 — 라이브러리 · 부품 목록 · 고른 부품.
   * 떠 있는 층이라 도움말 창(#sheet)과 같은 유리를 쓴다. 칸 사이는 선 하나로만 가른다
   * (유리 위에 유리를 겹치지 않는다).
   */
  #libwin { position:fixed; z-index:50; left:50%; top:50%; transform:translate(-50%,-50%);
            width:min(1060px, calc(100vw - 32px)); height:min(660px, calc(100dvh - 48px));
            display:grid; grid-template-rows:auto minmax(0,1fr) auto;
            background:var(--glass), var(--surface-sheet); border:1px solid var(--edge);
            border-radius:16px;
            -webkit-backdrop-filter:var(--blur-menu, var(--blur));
            backdrop-filter:var(--blur-menu, var(--blur));
            box-shadow: inset 1px 1px 1px var(--rim-lit),
                        inset -1px -1px 1px var(--rim-dim), var(--shadow-float); }
  :root.solid #libwin { -webkit-backdrop-filter:none; backdrop-filter:none; }
  @media (prefers-reduced-transparency: reduce) { #libwin { -webkit-backdrop-filter:none; backdrop-filter:none; } }
  .lw-head { display:flex; align-items:center; gap:10px; padding:10px 12px;
             border-bottom:1px solid var(--border); }
  .lw-head b { font-size:14px; color:var(--fg); white-space:nowrap; }
  .lw-head input { flex:1 1 auto; min-width:0; height:30px; padding:0 10px; font:13px var(--font);
                   border:1px solid var(--border); border-radius:8px;
                   background:var(--field, var(--inset)); color:var(--text, #d9dee6); }
  .lw-head input:focus { outline:none; border-color:var(--accent); }
  .lw-body { display:grid; grid-template-columns:216px minmax(0,1fr) 300px; min-height:0; }
  .lw-tree, .lw-list, .lw-info { overflow:auto; min-height:0; }
  .lw-tree { padding:8px; border-right:1px solid var(--border); }
  .lw-info { padding:12px 14px 16px; border-left:1px solid var(--border); }
  .lw-node { display:flex; align-items:center; gap:8px; width:100%; min-height:26px; padding:3px 8px;
             margin:1px 0; border:0; background:none; border-radius:7px; color:var(--text, #d9dee6);
             font:inherit; text-align:left; cursor:pointer; }
  .lw-node .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lw-node .n { margin-left:auto; font:11px var(--mono); opacity:.55; }
  .lw-node:hover { background:var(--fill-strong); color:var(--fg); }
  .lw-node.on { background:var(--accent); color:var(--on-accent); }
  .lw-node.on .n { opacity:.8; }
  .lw-node.lib { font-weight:600; margin-top:8px; }
  .lw-node.grp { padding-left:22px; color:var(--mut); }
  .lw-node.grp.on { color:var(--on-accent); }
  .lw-list table { width:100%; border-collapse:separate; border-spacing:0; }
  .lw-list th { position:sticky; top:0; z-index:1; background:var(--field, var(--inset)); text-align:left;
                font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut);
                padding:7px 10px; font-weight:600; border-bottom:1px solid var(--border); }
  .lw-list td { padding:5px 10px; white-space:nowrap; }
  .lw-list td.v { max-width:180px; overflow:hidden; text-overflow:ellipsis; }
  .lw-list td.v, .lw-list td.ref, .lw-list td.el { font:11.5px var(--mono); color:var(--mut); }
  .lw-list tr.row { cursor:pointer; }
  .lw-list tr.row:hover td { background:var(--fill); }
  .lw-list tr.row.on td { background:var(--accent); color:var(--on-accent); }
  .lw-list tr.row.on td:first-child { border-radius:7px 0 0 7px; }
  .lw-list tr.row.on td:last-child { border-radius:0 7px 7px 0; }
  .lw-list tr.sec td { padding:12px 10px 4px; font-size:10.5px; text-transform:uppercase;
                       letter-spacing:.05em; color:var(--mut); font-weight:600; }
  .lw-list .path { margin-left:8px; font-size:11px; color:var(--mut); }
  .lw-list tr.on .path { color:var(--on-accent); opacity:.75; }
  .lw-list table { padding:0 6px 8px; }
  .lw-empty { padding:16px; color:var(--mut); line-height:1.7; }
  .lw-empty .btn { margin-top:8px; }
  .lw-title b { display:block; font-size:15px; color:var(--fg); }
  .lw-title span { color:var(--mut); font-size:11.5px; }
  .lw-sym { margin:10px 0; height:184px; border:1px solid var(--border); border-radius:10px;
            background:var(--inset); }
  .lw-sym canvas { display:block; width:100%; height:100%; }
  .lw-desc { margin:0; line-height:1.55; color:var(--text, #d9dee6); }
  .lw-sec { margin:14px 0 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
            color:var(--mut); font-weight:600; }
  .lw-kv { width:100%; border-collapse:collapse; }
  .lw-kv th { text-align:left; font-weight:400; color:var(--mut); padding:3px 12px 3px 0;
              white-space:nowrap; vertical-align:top; width:1%; }
  .lw-kv td { padding:3px 0; font:11.5px var(--mono); color:var(--fg); overflow-wrap:anywhere; }
  .lw-kv.pins th { font:11.5px var(--mono); color:var(--fg); }
  .lw-kv.pins td { font:12px var(--font); color:var(--mut); }
  .lw-info pre { padding:8px 10px; background:var(--inset); border-radius:8px; font-size:11.5px;
                 white-space:pre-wrap; overflow-wrap:anywhere; }
  .lw-foot { display:flex; align-items:center; gap:12px; padding:9px 12px;
             border-top:1px solid var(--border); }
  .lw-foot .note { margin:0; flex:1 1 auto; min-width:0; }
  .lw-count { color:var(--mut); font:11px var(--mono); white-space:nowrap; }
  .btn.primary { background:var(--accent); color:var(--on-accent); border-color:transparent;
                 font-weight:600; min-width:76px; justify-content:center; }
  .btn.primary:hover:not(:disabled) { background:var(--accent-hover); }
  .btn:disabled { opacity:.45; cursor:default; }
  @media (max-width: 1000px) {
    .lw-body { grid-template-columns:168px minmax(0,1fr) 250px; }
    .lw-list td.v { max-width:120px; }
  }
  /*
   * 좁은 화면: 세 칸을 위아래로. 라이브러리는 가로로 미는 줄 하나(칸은 숨긴다), 그 아래 목록,
   * 맨 아래 고른 부품. 창은 화면을 거의 다 쓴다 — 폰에서 가운데 뜬 작은 창은 못 쓴다.
   */
  @media (max-width: 760px) {
    #libwin { width:calc(100vw - 12px); height:calc(100dvh - 12px); border-radius:14px; }
    .lw-head b { display:none; }
    .lw-body { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) minmax(0,40%); }
    .lw-tree { display:flex; gap:4px; overflow-x:auto; overflow-y:hidden; padding:6px 8px;
               border-right:0; border-bottom:1px solid var(--border); scrollbar-width:none; }
    .lw-tree::-webkit-scrollbar { display:none; }
    .lw-node { width:auto; flex:0 0 auto; margin:0; }
    .lw-node.lib { margin:0; }
    .lw-node.grp { display:none; }
    .lw-info { border-left:0; border-top:1px solid var(--border); }
    .lw-sym { height:132px; }
    .lw-list td.ref { display:none; }
    .lw-list th.ref { display:none; }
    .lw-foot .note { display:none; }
    .lw-foot .lw-count { flex:1 1 auto; }
  }
  @media (pointer: coarse) {
    .lw-node { min-height:34px; }
    .lw-list td { padding:9px 10px; }
  }

  /* 왼쪽 부품 목록의 머리: 이름 + 라이브러리 창 단추 */
  .libhead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 7px; }
  .libhead h2 { margin:0; }
  .libhead .btn { height:22px; padding:0 8px; font-size:11px; gap:5px; }
  .libsub { font-size:10px; color:var(--mut); opacity:.8; margin:7px 0 2px 8px; letter-spacing:.03em; }
  .libitems .libsub:first-child { margin-top:2px; }

  #ctx, .menu { position:fixed; z-index:40; min-width:210px; border-radius:11px; padding:5px; }
  /* 도움말·단축키·라이선스가 같이 쓰는 큰 창 */
  #sheet { position:fixed; z-index:50; left:50%; top:50%; transform:translate(-50%,-50%);
           width:min(680px, calc(100vw - 32px)); max-height:min(76vh, 720px);
           display:grid; grid-template-rows:auto minmax(0,1fr);
           background:var(--glass), var(--surface-sheet); border:1px solid var(--edge);
           border-radius:16px;
           -webkit-backdrop-filter:var(--blur-menu, var(--blur));
           backdrop-filter:var(--blur-menu, var(--blur));
           box-shadow: inset 1px 1px 1px var(--rim-lit),
                       inset -1px -1px 1px var(--rim-dim), var(--shadow-float); }
  .sheet-head { display:flex; align-items:center; justify-content:space-between;
                padding:12px 14px; border-bottom:1px solid var(--border); }
  .sheet-head b { font-size:14px; color:var(--fg); }
  .sheet-body { overflow:auto; padding:12px 14px 16px; }
  table.help { width:100%; border-collapse:collapse; margin-top:4px; }
  table.help caption { text-align:left; font-size:10.5px; text-transform:uppercase;
                       letter-spacing:.06em; color:var(--mut); padding:12px 0 4px; font-weight:600; }
  table.help th { text-align:left; font-weight:600; color:var(--fg); padding:4px 14px 4px 0;
                  white-space:nowrap; vertical-align:top; width:1%; }
  table.help td { padding:4px 0; color:var(--mut); line-height:1.55; }
  table.keys td { text-align:right; }
  .sheet-foot { margin:14px 0 0; padding-top:10px; border-top:1px solid var(--border); color:var(--mut); font-size:12.5px; }
  .sheet-foot a { color:var(--accent); text-decoration:none; }
  .sheet-foot a:hover { text-decoration:underline; }
  .keycap { font:11px var(--mono); min-width:96px; justify-content:center; }
  .keycap.changed { border-color:var(--accent); color:var(--accent); }
  #ctx button, .menu button { display:block; width:100%; text-align:left; border:0; background:none;
                padding:6px 8px; border-radius:7px; color:var(--text, #d9dee6); cursor:pointer; font:inherit; }
  #ctx button:hover, .menu button:hover:not(:disabled) { background:var(--accent); color:var(--on-accent); }
  .menu button { display:flex; justify-content:space-between; gap:18px; align-items:center; }
  .menu button:disabled { opacity:.4; cursor:default; }
  .menu button .k { font:11px var(--mono); opacity:.6; }
  .menu button:hover .k { opacity:.8; }
  .menu button .tick { width:12px; flex:0 0 12px; }
  /* 메뉴가 길면 (예제) 화면 안에서 스크롤 */
  .menu { max-height:calc(100dvh - 48px); overflow-y:auto; }
  .menu .mh { font:600 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mut); padding:7px 10px 4px; }
  #ctx hr, .menu hr { border:0; border-top:1px solid var(--border); margin:4px 6px; }

  /* ── 하단 ──────────────────────────────────────────────────────── */

  /*
   * 높이를 화면에 묶는다. 고정 px 로 두면 가로로 든 폰(360px 높이)에서 아래 패널이
   * 210px 을 그대로 차지해 **캔버스가 34px** 로 찌그러졌다 — 잘리진 않지만 못 쓴다.
   * 가름대로 끌어 키운 값도 짧은 화면에서는 여기서 눌린다.
   */
  /*
   * 칸도 명시한다 (body 와 같은 이유). 탭이 여섯이 되면서 탭 줄의 min-content(426px)가 폰의 폭(390px)을
   * 넘었는데, 암묵적 칸은 그 min-content 를 따라가서 **아래 패널이 통째로 화면보다 넓어졌다.**
   * 칸을 패널 폭에 묶고 탭 줄을 옆으로 스크롤하게 한다.
   */
  #bottom { display:grid; grid-template-rows:auto minmax(0,1fr); grid-template-columns:minmax(0,1fr);
            height:min(var(--bottom-h, 272px), 45dvh); }
  #tabs { display:flex; gap:2px; padding:6px 8px 0; align-items:center; min-width:0;
          overflow-x:auto; scrollbar-width:none; }
  #tabs::-webkit-scrollbar { display:none; }
  #tabs button { flex:0 0 auto; height:26px; padding:0 11px; background:none; border:0; border-radius:8px;
                 color:var(--mut); font:inherit; font-weight:600; cursor:pointer; }
  #tabs button:hover { background:var(--fill-strong); color:var(--fg); }
  #tabs button.on { background:var(--fill-strong); box-shadow:var(--sheen); color:var(--fg); }
  #tabbody { overflow:auto; padding:8px 10px; min-height:0; }
  /*
   * 파형은 아래 패널이 주는 높이를 그대로 쓴다. 높이를 상수로 두면 패널을 키워도
   * 그래프는 그대로라 빈 자리만 는다. 칸마다 min-height:0 을 붙이는 것은 flex 항목이
   * 기본으로 내용보다 작아지지 않아서다 — 그게 없으면 세로로 줄지 않는다.
   */
  #wave { width:100%; flex:1 1 0; min-height:80px; display:block; }
  #waverow { display:flex; gap:14px; align-items:stretch; height:100%; min-height:0; }
  #wavecol { flex:1 1 0; min-width:0; display:flex; flex-direction:column; min-height:0; }
  #readout { flex:0 0 auto; padding-top:4px; max-width:300px; }
  #readout table, #tabbody table { width:auto; border-collapse:collapse; }
  #readout th, #tabbody th { font-weight:600; color:var(--mut); padding:2px 12px 2px 0;
                             text-align:right; font-size:10.5px; text-transform:uppercase;
                             letter-spacing:.04em; }
  #readout th:first-child, #tabbody th:first-child { text-align:left; }
  #readout td, #tabbody td { padding:2px 12px 2px 0; text-align:right; font-family:var(--mono); }
  #readout td:first-child, #tabbody td:first-child { text-align:left; white-space:nowrap;
                                                     font-family:var(--font); }
  #readout.empty { color:var(--mut); }
  pre { margin:0; font:12px/1.55 var(--mono); white-space:pre-wrap; color:var(--text, #d9dee6); }
  .issue { padding:3px 0; }
  .issue b { font-weight:600; }
  .error b { color:var(--bad); } .warning b { color:var(--warn); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font:11px var(--mono);
            color:var(--mut); margin-top:6px; }
  .sw { display:inline-block; width:10px; height:3px; border-radius:2px; vertical-align:3px; margin-right:5px; }
  /* 확대 중일 때만 나오는 '전체 보기'. 범례 줄에 글자처럼 얹는다 */
  .legend button { font:inherit; color:var(--accent); background:none; border:0; padding:0;
                   cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .legend button:hover { color:var(--fg); }

  /*
   * 계산기 탭 (src/ui/calc-panel.ts). 왼쪽은 식의 줄들, 오른쪽은 파형으로 나온 줄들의 그림.
   * 파형 탭처럼 아래 패널이 주는 높이를 그대로 쓴다 — 칸마다 min-height:0 이 있어야 세로로 줄어든다.
   */
  #calc { display:flex; gap:14px; height:100%; min-height:0; }
  #calc-main { flex:1.15 1 0; min-width:0; min-height:0; display:flex; flex-direction:column; }
  #calc-plot, #noiseview { flex:1 1 0; min-width:0; min-height:0; display:flex; flex-direction:column; }
  #noiseview { height:100%; }
  .calc-bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .calc-bar .sp { flex:1 1 auto; }
  .chip { display:inline-flex; align-items:center; gap:2px; height:22px; padding:0 3px 0 9px;
          border:1px solid var(--border-strong); border-radius:11px; font:11px var(--mono); color:var(--fg); }
  .chip button { border:0; background:none; color:var(--mut); cursor:pointer; padding:0 4px;
                 font-size:14px; line-height:1; }
  .chip button:hover { color:var(--fg); }
  .calc-rows { flex:1 1 0; min-height:0; overflow:auto; padding-right:2px; }
  /* 체크 · 식 · 결과 · 지우기. 식과 결과는 둘 다 0 까지 줄어야 긴 식이 패널을 밀어내지 않는다 */
  .calc-row { display:grid; grid-template-columns:16px minmax(0,1.2fr) minmax(0,1fr) 24px;
              gap:7px; align-items:center; margin:3px 0; }
  .calc-row input.expr { width:100%; min-width:0; font:12px var(--mono); height:26px; padding:0 7px;
                         border:1px solid var(--border); border-radius:5px;
                         background:var(--field, var(--inset)); color:var(--text, #d9dee6); }
  .calc-row input.expr:focus { outline:none; border-color:var(--accent); }
  .calc-row input[type=checkbox] { margin:0; width:14px; height:14px; cursor:pointer; }
  .calc-row input[type=checkbox]:disabled { visibility:hidden; }
  .calc-row .plus { color:var(--mut); text-align:center; font:14px var(--mono); }
  .calc-row .res { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                   font:12px var(--mono); color:var(--fg); }
  .calc-row .res .det { color:var(--mut); margin-left:8px; font-size:11px; }
  .calc-row .res .err { color:var(--warn); }
  .calc-row .res .wave { color:var(--mut); }
  .calc-row .del { width:24px; height:24px; padding:0; justify-content:center; font-size:15px; line-height:1; }
  .calc-row.new .res { font-family:var(--font); }
  /* 손가락으로는 옆으로 끌어 값을 읽는다. 위아래 끌기는 그대로 스크롤이다 */
  canvas.plot { width:100%; flex:1 1 0; min-height:80px; display:block; cursor:crosshair; touch-action:pan-y; }
  .plot-bar { display:flex; gap:10px; align-items:flex-start; justify-content:space-between; min-height:22px; }
  .plot-bar .legend { margin-top:3px; }
  .plot-tools { display:flex; gap:4px; flex:0 0 auto; }
  .plot-tools .btn { height:20px; padding:0 7px; font-size:10.5px; border-radius:6px; }
  .plot-tools .btn.on { border-color:var(--accent); color:var(--accent); }
  .plot-read { display:flex; gap:14px; flex-wrap:wrap; font:11px var(--mono); color:var(--mut);
               min-height:16px; margin-top:3px; }
  .plot-read .sw { vertical-align:3px; }

  /*
   * 고르기 목록 (성능지표 · 신호 · 함수). 아래 패널에서 위로 열린다.
   *
   * 메뉴와 같은 유리지만 판은 거의 불투명하게 한다 (--surface-pop). 메뉴는 짧은 낱말 몇 줄이라
   * 뒤가 조금 비쳐도 읽히는데, 이 목록은 설명글이 빽빽하고 부품 목록 · 탭 글자 위를 넓게 덮는다.
   * 뒤 흐림(backdrop-filter)이 빠지는 환경에서는 — 소프트웨어 렌더러의 고배율 화면에서 실제로
   * 빠졌다 — 뒤 글자와 겹쳐 읽을 수 없게 된다. 흐림에 기대지 않고도 읽혀야 한다.
   */
  #calcpop { position:fixed; z-index:45; width:min(460px, calc(100vw - 16px)); border-radius:14px;
             padding:8px; display:flex; flex-direction:column;
             background:var(--glass), var(--surface-pop); }
  #calcpop > input { width:100%; font:12px var(--mono); height:28px; padding:0 8px; flex:0 0 auto;
                     border:1px solid var(--border); border-radius:7px;
                     background:var(--field, var(--inset)); color:var(--text, #d9dee6); }
  #calcpop > input:focus { outline:none; border-color:var(--accent); }
  .plist { overflow:auto; margin-top:6px; min-height:0; }
  .phead { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
           color:var(--mut); padding:9px 8px 3px; }
  .phead small { font-weight:400; text-transform:none; letter-spacing:0; margin-left:8px; opacity:.85; }
  .pitem { display:block; width:100%; text-align:left; border:0; background:none; border-radius:7px;
           padding:5px 8px; color:var(--text, #d9dee6); cursor:pointer; font:inherit; }
  .pitem.on, .pitem:hover { background:var(--accent); color:var(--on-accent); }
  .pitem .top { display:flex; gap:8px; justify-content:space-between; align-items:baseline; }
  .pitem b { font-weight:600; }
  .pitem code { font:11.5px var(--mono); opacity:.9; overflow-wrap:anywhere; }
  .pitem .doc { font-size:11px; color:var(--mut); line-height:1.45; margin-top:2px; white-space:normal; }
  .pitem.on .doc, .pitem:hover .doc { color:var(--on-accent); opacity:.82; }
  .pitem .tag { flex:0 0 auto; font-size:10px; border:1px solid currentColor; border-radius:4px;
                padding:0 4px; opacity:.7; white-space:nowrap; }
  .pitem.dim:not(.on):not(:hover) { opacity:.68; }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* ── 좁은 화면: 옆 패널을 서랍으로 ─────────────────────────────── */
  .only-narrow { display:none !important; }
  @media (max-width: 900px) {
    body { grid-template-rows:34px 40px minmax(0,1fr) auto auto; }
    #mid { grid-template-columns:minmax(0,1fr); position:relative; }
    .split.v { display:none; }
    #lib, #props { position:absolute; top:0; bottom:0; z-index:30; width:min(300px, 86vw);
                   display:none; background:var(--glass), var(--surface-menu);
                   -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
                   box-shadow:var(--shadow-float), var(--sheen); }
    #lib { left:0; border-radius:0 var(--radius-card) var(--radius-card) 0; }
    #props { right:0; border-radius:var(--radius-card) 0 0 var(--radius-card); }
    #lib.open, #props.open { display:block; }
    /*
     * 어시스턴트도 서랍이다. 오른쪽에서 열리고 거의 화면 너비를 쓴다 — 대화는 좁으면 읽기 어렵다. 세로로는
     * 툴바 아래부터 화면 끝까지(아래 패널 위까지) 덮는다: 폰에서는 가운데 칸만으로는 대화가 몇 줄 안 들어간다.
     * 툴바는 남아서 실행 · 모드 · 어시스턴트 버튼을 그대로 누른다. 왼쪽에 조금 남긴 캔버스를 누르면 닫힌다.
     * 넓은 화면의 '칸을 닫아 둠'은 여기서 상관없다.
     */
    #ai { position:fixed; top:var(--mid-top, 90px); bottom:max(6px, env(safe-area-inset-bottom)); right:0; z-index:31;
          width:min(460px, 92vw);
          display:none; background:var(--glass), var(--surface-menu);
          -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
          box-shadow:var(--shadow-float), var(--sheen);
          border-radius:var(--radius-card) 0 0 var(--radius-card); }
    #ai.open, :root.no-ai #ai.open { display:flex; }
    .only-narrow { display:inline-flex !important; }
    #bottom { height:min(var(--bottom-h-narrow, 210px), 38dvh); }
  }
  @media (max-width: 1100px) { #status { display:none; } }
  @media (max-width: 900px) { #save { display:none; } }
  /* 좁으면 파형과 커서 표를 위아래로 쌓는다 — 나란히 두면 그래프가 실오라기가 된다 */
  @media (max-width: 760px) {
    /*
     * 위아래로 쌓으면 높이를 나눠 가질 수 없다. 파형에 자리를 주고 표는 아래로 흘린다.
     *
     * #wavecol 의 flex 를 되돌리는 것이 핵심이다. 가로로 놓였을 때는 `1 1 0` 의 0 이
     * **너비**라 괜찮지만, 세로로 쌓이면 그 0 이 **높이**가 되어 칸이 납작해지고
     * 안의 캔버스가 밖으로 비어져 나온다 — 그러면 커서 표가 그래프 위에 겹쳐 적힌다.
     */
    #waverow { flex-direction:column; gap:8px; height:auto; }
    #wavecol { flex:0 0 auto; }
    #wave { flex:0 0 auto; height:170px; }
    #readout { max-width:none; width:100%; padding-top:0; }
    /*
     * 계산기도 같다: 줄들 아래에 그림을 놓고, 높이를 나눠 갖지 않게 한다. .calc-rows 의 flex 를 되돌리는
     * 것이 핵심이다 — `1 1 0` 인 채로 부모의 높이가 auto 가 되면 그 0 이 높이가 되어 줄들이 납작해지고,
     * 넘친 줄 위에 그림이 겹쳐 그려진다 (파형 탭이 겪은 것과 같은 일이다).
     */
    #calc { flex-direction:column; height:auto; gap:8px; }
    #calc-main, #calc-plot { flex:0 0 auto; }
    .calc-rows { flex:0 0 auto; overflow:visible; }
    canvas.plot { flex:0 0 auto; height:170px; }
    #noiseview { height:auto; }
    .calc-row { grid-template-columns:16px minmax(0,1fr) 24px; }
    .calc-row .res { grid-column:2 / 3; grid-row:2; white-space:normal; }
    .calc-row .del { grid-column:3; grid-row:1; }
  }
  @media (max-width: 700px) {
    .tool-group.g-annot, .tool-group.g-file { display:none; }
  }
  @media (max-width: 520px) {
    .tool-group.g-hist, .tool-group.g-view { display:none; }
    #menubar > #t-ai { padding:0 7px; gap:3px; }
    /* 폰에서는 모드 단추를 하나만 — 누르면 갈 모드. 테마 단추와 같은 생각이다 (지금 상태는 화면이 보여 준다) */
    .tool-btn.mode.on { display:none; }
    #brand { display:none; }
    /* 글자 사이를 좁혀 메뉴 일곱 개가 폰 한 줄에 들어오게 한다 (403px → 347px) */
    #menubar { padding:0 6px; }
    #menus > button { padding:0 6px; }
  }
  /* 손가락으로 쓰는 화면에서는 과녁을 키운다 */
  @media (pointer: coarse) {
    body { grid-template-rows:34px 46px minmax(0,1fr) auto auto; }
    .tool-btn { height:34px; min-width:36px; }
    #demos button, .btn, #tabs button { min-height:30px; }
    .plot-tools .btn { min-height:26px; }
    .pitem { padding:8px; }
    .libitem { height:32px; line-height:32px; }
    .fitem { min-height:34px; }
    #ctx button { padding:9px 8px; }
  }
</style>
</head>
<body>
  <div id="menubar" class="card">
    <span id="brand">Melange</span>
    <div id="menus"></div>
    <button id="t-ai" type="button" data-icon="assistant" data-icon-size="14" title="Assistant (Shift+A) — stays at the right of every view"><span class="lbl">AI</span></button>
    <button id="t-theme" type="button"></button>
  </div>

  <div id="toolbar" class="card">
    <div id="tools">
    <div class="tool-group g-mode" role="group" aria-label="Mode">
      <button id="m-simple" class="tool-btn mode" type="button" title="Simple mode — the schematic, the assistant and the results">Simple</button>
      <button id="m-edit" class="tool-btn mode on" type="button" title="Edit mode — the full editor">Edit</button>
    </div>
    <div class="tool-group only-narrow g-libbtn">
      <button id="t-lib" class="tool-btn" data-icon="parts" title="Parts panel"></button>
    </div>
    <div class="tool-group g-tools">
      <button id="t-select" class="tool-btn on" data-icon="select" title="Select (Esc)"></button>
      <button id="t-wire" class="tool-btn" data-icon="wire" title="Wire (W)"></button>
      <button id="t-label" class="tool-btn" data-icon="label" title="Net label (N)"></button>
      <button id="t-gnd" class="tool-btn" data-icon="gnd" title="GND (G)"></button>
      <button id="t-power" class="tool-btn" data-icon="power" title="Supply symbol (Shift+G)"></button>
      <button id="t-probe" class="tool-btn" data-icon="probe" title="Voltage probe (P)"></button>
      <button id="t-junction" class="tool-btn" data-icon="junction" title="Junction (Alt+J)"></button>
      <button id="t-nc" class="tool-btn" data-icon="nc" title="No-connect (Q)"></button>
    </div>
    <div class="tool-group g-annot">
      <button id="t-spice" class="tool-btn" data-icon="spice" title="SPICE directive (D)"></button>
      <button id="t-text" class="tool-btn" data-icon="text" title="Text (T)"></button>
      <button id="t-line" class="tool-btn" data-icon="line" title="Line (Alt+L)"></button>
      <button id="t-rect" class="tool-btn" data-icon="rect" title="Rectangle (R)"></button>
    </div>
    <div class="tool-group g-edit">
      <button id="t-del" class="tool-btn" data-icon="del" title="Delete (Del)"></button>
      <button id="t-rot" class="tool-btn" data-icon="rot" title="Rotate (Space)"></button>
      <button id="t-flipx" class="tool-btn" data-icon="flipx" title="Flip horizontal (X)"></button>
      <button id="t-flipy" class="tool-btn" data-icon="flipy" title="Flip vertical (Y)"></button>
    </div>
    <div class="tool-group g-hist">
      <button id="t-undo" class="tool-btn" data-icon="undo" title="Undo (Ctrl+Z)"></button>
      <button id="t-redo" class="tool-btn" data-icon="redo" title="Redo (Ctrl+Y)"></button>
    </div>
    <div class="tool-group g-view">
      <button id="t-fit" class="tool-btn" data-icon="fit" title="Zoom to fit (K)"></button>
    </div>

    </div>

    <div id="right">
      <span id="save"></span>
      <span id="status"></span>
      <div class="tool-group">
        <button id="t-run" class="tool-btn wide run" data-icon="run" title="Run simulation (F8)"><span>Run</span></button>
      </div>
      <div class="tool-group only-narrow g-propsbtn">
        <button id="t-props" class="tool-btn" data-icon="props" title="Properties panel"></button>
      </div>
    </div>
    <input type="file" id="file" accept=".sp,.cir,.json,.txt" hidden>
  </div>

  <div id="mid">
    <div id="lib" class="card">
      <div class="libhead">
        <h2>Parts</h2>
        <button id="open-lib" class="btn" type="button" data-icon="library" data-icon-size="13"
                title="Component library (Shift+F)">Library</button>
      </div>
      <div id="palette"></div>
      <h2>Help</h2>
      <div class="note">
        Pick a part, then click the canvas<br>
        <b>W</b> wire · <b>N</b> label · <b>Shift+F</b> component library<br>
        Drag to move · right-click for the menu<br>
        Wheel zooms · Shift+wheel pans sideways
      </div>
    </div>

    <div class="split v" id="split-lib"></div>

    <div id="stage" class="card">
      <canvas id="static" class="layer"></canvas>
      <canvas id="text" class="layer"></canvas>
      <canvas id="overlay" class="layer"></canvas>
    </div>

    <div class="split v" id="split-props"></div>

    <div id="props" class="card">
      <h2>Properties</h2>
      <div id="propbody" class="empty">Nothing selected</div>
      <h2>Simulation</h2>
      <div id="simbody"></div>
    </div>

  </div>

  <div class="split h" id="split-bottom"></div>

  <div id="bottom" class="card">
    <div id="tabs">
      <button id="tab-wave" class="on">Waveform</button>
      <button id="tab-net">Netlist</button>
      <button id="tab-log">Log</button>
      <button id="tab-issue">Issues</button>
      <button id="tab-meas">Measure</button>
      <button id="tab-calc">Calculator</button>
      <span class="sp"></span>
    </div>
    <div id="tabbody"></div>
  </div>

  <div class="split v" id="split-ai"></div>
  <div id="ai" class="card" aria-label="Assistant">
    <div class="ai-boot">Loading the assistant…</div>
  </div>

<script type="module" src="/src/app.ts"></script>
</body>
</html>
