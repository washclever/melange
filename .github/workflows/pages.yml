# Builds the site and publishes it to GitHub Pages.
#
# The checks run before the build on purpose: a deploy that went out green but with
# a broken netlist is worse than no deploy. `npm ci` runs the postinstall that pulls
# spice.wasm out of the engine package, so the build has it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The test runners are .ts files run directly, which needs Node's type stripping.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify
      - run: npm run e2e
      - run: npm run build
      # enablement: 저장소에서 Pages 를 아직 안 켰으면 여기서 켠다.
      # 안 켜 두면 첫 실행이 "Pages site not found" 로 떨어진다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
