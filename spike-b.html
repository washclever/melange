<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melange spike B</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --mut:#666; --line:#d8d8d8;
          --grid:#e3e6ea; --grid2:#c9ced6; --part:#334; --wire:#2563eb; --snap:#16a34a;
          --pin:#94a3b8; --panel:#f6f7f9; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111417; --fg:#e8e8e8; --mut:#9aa0a6; --line:#2e3338;
            --grid:#1b1f24; --grid2:#2b3138; --part:#c7d0da; --wire:#60a5fa; --snap:#4ade80;
            --pin:#5b6672; --panel:#171b1f; --bad:#f87171; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.55 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
         display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #overlay { pointer-events:none; }
  aside { width:290px; flex:none; border-left:1px solid var(--line); background:var(--panel);
          padding:14px 16px; overflow-y:auto; }
  h1 { font-size:14px; margin:0 0 3px; font-weight:600; }
  .sub { color:var(--mut); font-size:12px; margin:0 0 14px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut);
       margin:18px 0 8px; font-weight:600; }
  label { display:block; margin:9px 0; font-size:12px; }
  label .row { display:flex; justify-content:space-between; margin-bottom:3px; }
  label b { font-family:ui-monospace,Consolas,monospace; font-weight:600; }
  input[type=range] { width:100%; margin:0; }
  .toggle { display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:7px;
            background:color-mix(in srgb, var(--fg) 6%, transparent); cursor:pointer; margin:10px 0; }
  .toggle input { margin:0; } .toggle span { font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:4px 0; } td:last-child { text-align:right; font-family:ui-monospace,Consolas,monospace; }
  td.warn { color:var(--bad); font-weight:600; }
  .keys { font-size:11.5px; color:var(--mut); line-height:1.75; }
  kbd { font-family:ui-monospace,Consolas,monospace; background:color-mix(in srgb,var(--fg) 9%,transparent);
        padding:1px 5px; border-radius:3px; font-size:11px; }
  button { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px;
           background:var(--bg); color:var(--fg); cursor:pointer; }
  button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .seg { display:flex; gap:5px; margin:8px 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="static"></canvas>
  <canvas id="overlay"></canvas>
</div>
<aside>
  <h1>Spike B — feel</h1>
  <p class="sub">Snapping, hysteresis, same-frame drawing</p>

  <label class="toggle">
    <input type="checkbox" id="hyst" checked>
    <span><b>Hysteresis</b> — turn it off and jitter between two pins</span>
  </label>

  <h2>Presets</h2>
  <div class="seg" id="presets"></div>

  <h2>Parameters</h2>
  <div id="sliders"></div>

  <h2>Measurements</h2>
  <table id="stats"></table>

  <h2>Controls</h2>
  <div class="keys">
    <kbd>W</kbd> wire · <kbd>Esc</kbd> cancel<br>
    Drag to move a part<br>
    Right-drag / middle button — pan<br>
    Wheel — zoom around the cursor<br>
    <kbd>K</kbd> zoom to fit
  </div>
</aside>
<script type="module" src="/src/spike-b.ts"></script>
</body>
</html>
